[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatNPM"
dynamic = ["version"]
description = "ChatNPM: ChatArch npm registry and package maintenance helper"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatstyle>=0.1.0,<0.2.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatnpm", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
chatnpm = "chatnpm.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<9.7", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatnpm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
